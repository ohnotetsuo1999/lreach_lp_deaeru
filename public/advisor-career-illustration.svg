<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f9ff"/>
      <stop offset="0.4" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="120" y1="200" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="160" y1="240" x2="240" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="100" y1="50" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92400e"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="150" y1="120" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="50" y1="320" x2="200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ca3af"/>
      <stop offset="0.5" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  
  <!-- Black background outside green border -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Content inside circle clip -->
  <g clip-path="url(#circleClip)">
    <!-- Blurred office/library background -->
    <rect width="400" height="400" fill="url(#bgGrad)" opacity="0.6"/>
    <!-- Bookshelf silhouette (left) -->
    <rect x="20" y="80" width="60" height="200" fill="#cbd5e1" opacity="0.3" rx="4"/>
    <rect x="30" y="100" width="40" height="20" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="130" width="40" height="20" fill="#94a3b8" opacity="0.4"/>
    <rect x="30" y="160" width="40" height="20" fill="#94a3b8" opacity="0.4"/>
    <!-- Plant silhouette (right) -->
    <ellipse cx="340" cy="280" rx="35" ry="50" fill="#86efac" opacity="0.25"/>
    <ellipse cx="330" cy="260" rx="25" ry="35" fill="#4ade80" opacity="0.3"/>
    
    <!-- Tablet/laptop (foreground) -->
    <g filter="url(#shadow)">
      <rect x="80" y="320" width="120" height="80" rx="8" fill="url(#tabletGrad)"/>
      <rect x="90" y="330" width="100" height="60" rx="4" fill="#1f2937" opacity="0.7"/>
      <line x1="100" y1="350" x2="180" y2="350" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="365" x2="160" y2="365" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
    </g>
    
    <!-- Shoulders and upper body -->
    <path d="M80 400c0-35 20-60 40-70l20-10c10 15 25 25 40 25s30-10 40-25l20 10c20 10 40 35 40 70v15H80v-15z" fill="url(#jacketGrad)"/>
    
    <!-- Blouse/shirt -->
    <path d="M140 280c6 12 18 20 30 20s24-8 30-20l-12 30c-4 5-10 8-18 8s-14-3-18-8l-12-30z" fill="url(#shirtGrad)"/>
    <path d="M150 280l20 35 20-35" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    
    <!-- Neck -->
    <path d="M160 240h80v30c0 8-8 14-18 14s-18-6-18-14v-30h-26z" fill="url(#skinGrad)"/>
    
    <!-- Face outline -->
    <ellipse cx="200" cy="160" rx="70" ry="80" fill="url(#skinGrad)"/>
    
    <!-- Ears -->
    <ellipse cx="130" cy="170" rx="12" ry="16" fill="#fbbf24"/>
    <ellipse cx="270" cy="170" rx="12" ry="16" fill="#fbbf24"/>
    
    <!-- Earrings (silver hoops) -->
    <circle cx="130" cy="185" r="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="270" cy="185" r="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Hair (back and sides) -->
    <path d="M125 140c0-35 20-60 45-60s45 25 45 60c0 12-3 22-7 30 5-6 8-15 8-25 0-28-20-48-46-48s-46 20-46 48c0 10 3 19 8 25-4-8-7-18-7-30z" fill="url(#hairGrad)"/>
    <!-- Front bangs -->
    <path d="M140 100c10-20 25-32 40-32s30 12 40 32c-10-12-22-18-40-18s-30 6-40 18z" fill="url(#hairGrad)"/>
    <!-- Side hair (left) -->
    <path d="M130 150c-3 10-5 22-3 35 1-13 4-25 8-35h-5z" fill="url(#hairGrad)"/>
    <!-- Side hair (right) -->
    <path d="M270 150c3 10 5 22 3 35-1-13-4-25-8-35h5z" fill="url(#hairGrad)"/>
    
    <!-- Eyebrows (soft arch) -->
    <path d="M165 125c5-3 10-4 15-4" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M220 122c5 1 10 2 15 4" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Eyes (brown) -->
    <ellipse cx="180" cy="150" rx="6" ry="7" fill="#78350f"/>
    <ellipse cx="220" cy="150" rx="6" ry="7" fill="#78350f"/>
    <!-- Eye highlights -->
    <ellipse cx="182" cy="148" rx="2" ry="2.5" fill="#fff" opacity="0.95"/>
    <ellipse cx="222" cy="148" rx="2" ry="2.5" fill="#fff" opacity="0.95"/>
    <!-- Eyelashes -->
    <path d="M170 145c3-2 5-3 8-3M210 143c3 0 5 1 8 3" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Nose -->
    <path d="M200 175v12" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Mouth (gentle smile) -->
    <path d="M185 195c6 5 14 5 20 0" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Cheeks -->
    <ellipse cx="160" cy="180" rx="10" ry="6" fill="#f87171" opacity="0.2"/>
    <ellipse cx="240" cy="180" rx="10" ry="6" fill="#f87171" opacity="0.2"/>
    
    <!-- Jacket lapel -->
    <path d="M150 250l20 15 20-15" stroke="#2563eb" stroke-width="2" fill="none"/>
    
    <!-- Gold "C" pin on left lapel -->
    <g transform="translate(155, 255)">
      <circle cx="0" cy="0" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
      <path d="M-3 -2 Q-4 0 -3 2" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Thick green border (circular) -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#00C853" stroke-width="8"/>
</svg>
