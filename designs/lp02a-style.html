<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>出会えるエージェント診断</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #f1f3f2; color: #121827; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
      .page { width: min(100%, 640px); margin: 0 auto; background: #fff; box-shadow: 0 12px 50px #11182712; }
      .hero { position: relative; }
      .slice { display: block; width: 100%; height: auto; }
      .hero-cta { position: absolute; bottom: 7%; left: 9%; width: 82%; display: block; border-radius: 999px; transition: transform .2s ease; }
      .hero-cta:hover, .floating-cta:hover { transform: translateY(-3px); }
      .hero-cta img, .floating-cta img { display: block; width: 100%; height: auto; }
      .form-section { padding: 46px 26px 64px; background: linear-gradient(180deg, #e8fff1, #fff 32%); scroll-margin-top: 16px; }
      .form-heading { margin: 0 0 8px; text-align: center; color: #101827; font-size: clamp(24px, 5vw, 32px); line-height: 1.45; }
      .form-lead { margin: 0 auto 26px; max-width: 34em; text-align: center; font-size: 15px; line-height: 1.8; }
      .form-card { padding: 28px; border: 1px solid #d9e8df; border-radius: 20px; background: #fff; box-shadow: 0 18px 40px #164a2920; }
      #lreach-form { display: grid; gap: 18px; }
      #lreach-form h2 { margin: 0 0 2px; font-size: 22px; line-height: 1.5; }
      #lreach-form > label { display: grid; gap: 7px; font-size: 15px; font-weight: 700; }
      #lreach-form input:not([type="checkbox"]), #lreach-form select { display: block; width: 100%; min-width: 0; padding: 13px; border: 1px solid #a9bdb1; border-radius: 8px; background: #fff; color: #121827; font: inherit; font-weight: 400; }
      #lreach-form fieldset { display: flex; gap: 10px 16px; flex-wrap: wrap; margin: 0; padding: 16px; border: 1px solid #a9bdb1; border-radius: 8px; }
      #lreach-form legend { padding: 0 5px; font-weight: 700; }
      #lreach-form fieldset label { display: inline-flex; gap: 5px; align-items: center; }
      #lreach-form button { min-height: 56px; border: 0; border-radius: 999px; background: linear-gradient(#ff741d, #e85600); box-shadow: 0 5px 0 #b74000; color: #fff; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
      #lreach-form button:disabled { opacity: .65; cursor: wait; }
      #lreach-status { min-height: 1.5em; margin: 0; color: #b42318; }
      :focus-visible { outline: 3px solid #0aaf60; outline-offset: 4px; }
      .footer { padding: 18px 22px 95px; background: #fff; text-align: center; font-size: 13px; }
      .footer a { color: #254d3a; text-underline-offset: 3px; }
      .floating-cta { position: fixed; z-index: 10; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; width: min(calc(100% - 28px), 560px); transform: translateX(-50%); filter: drop-shadow(0 5px 9px #0004); }
      .floating-cta[hidden] { display: none; }
      .floating-cta:hover { transform: translate(-50%, -3px); }
      @media (max-width: 480px) { .form-section { padding: 34px 16px 56px; } .form-card { padding: 20px; } #lreach-form h2 { font-size: 20px; } }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero-cta, .floating-cta { transition: none; } }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="出会えるエージェントのご案内">
        <img class="slice" src="/deaeru-lp99a-intro.png" alt="出会えるエージェント。転職こそ、タイパの時代。希望条件をもとにエージェントを紹介します。">
        <a class="hero-cta" href="#consultation" aria-label="エージェント診断フォームへ進む">
          <img src="/deaeru-lp99a-cta-button.png" alt="エージェント診断 START">
        </a>
      </section>
      <section aria-label="サービスのご案内">
        <img class="slice" src="/deaeru-lp02a-slice1.png" alt="転職するべきか悩んでいる、紹介される求人に納得できない、といったお悩み">
        <img class="slice" src="/deaeru-lp02a-slice2.png" alt="">
        <img class="slice" src="/deaeru-lp02a-slice3.png" alt="">
        <img class="slice" src="/deaeru-lp02a-slice4.png" alt="">
        <img class="slice" src="/deaeru-lp02a-slice5.png" alt="">
        <img class="slice" src="/deaeru-lp02a-slice6.png" alt="">
      </section>
      <section class="form-section" id="consultation" aria-label="エージェント診断フォーム">
        <h1 class="form-heading">あなたに合うエージェントを探す</h1>
        <p class="form-lead">お名前と希望勤務地などを入力して、次の案内へ進んでください。</p>
        <div class="form-card"><div data-lreach-form-placeholder>{{LREACH_FORM}}</div></div>
      </section>
      <img class="slice" src="/deaeru-lp02a-slice7.png" alt="">
      <footer class="footer"><a href="https://foresma.jp/" target="_blank" rel="noopener noreferrer">運営会社</a></footer>
    </main>
    <a class="floating-cta" href="#consultation" aria-label="エージェント診断フォームへ進む" hidden><img src="/deaeru-lp99a-cta-button.png" alt="エージェント診断 START"></a>
    <script>
      (() => {
        const hero = document.querySelector('.hero-cta');
        const form = document.querySelector('#consultation');
        const floating = document.querySelector('.floating-cta');
        if (!hero || !form || !floating || !('IntersectionObserver' in window)) return;
        let heroVisible = true;
        let formVisible = false;
        const update = () => { floating.hidden = heroVisible || formVisible; };
        new IntersectionObserver(([entry]) => { heroVisible = entry.isIntersecting; update(); }).observe(hero);
        new IntersectionObserver(([entry]) => { formVisible = entry.isIntersecting; update(); }).observe(form);
      })();
    </script>
  <script data-lreach-file-preview>
if (location.protocol === 'file:') {
  document.querySelectorAll('img[src^="/"]').forEach(image => {
    image.src = new URL('../public' + image.getAttribute('src'), location.href).href;
  });
  document.querySelector('[data-lreach-form-placeholder]').innerHTML =
    '<form id="lreach-form" aria-label="表示確認用フォーム">' +
    '<h2>' + "出会えるエージェント診断" + '</h2>' +
    '<label>お名前<input disabled></label>' +
    '<label>性別<select disabled><option>選択してください</option></select></label>' +
    '<label>生まれ年<input disabled></label>' +
    '<fieldset disabled><legend>希望勤務地（1つ以上）</legend>' +
    '<label><input type="checkbox">東京都</label><label><input type="checkbox">神奈川県</label>' +
    '<label><input type="checkbox">埼玉県</label><label><input type="checkbox">千葉県</label></fieldset>' +
    '<label>電話番号<input disabled></label>' +
    '<button disabled>回答してLINEへ進む</button>' +
    '<p>表示確認用です。発行後のページで回答できます。</p></form>';
}
</script></body>
</html>
